[package]
name = "guanacaste-render-rust"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Guanacaste Render: desktop interface for real-time architectural visualization."

[lib]
name = "guanacaste_render_rust"
path = "src/lib.rs"

[[bin]]
# Guanacaste 3D looks for `GuanacasteRender.exe` to hand models over; keep this name in step with
# `RenderApplication.ExecutableName` there.
name = "GuanacasteRender"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts"] }
rfd = { version = "0.15", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
miniz_oxide = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
roxmltree = "0.20"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
